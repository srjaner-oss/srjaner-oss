<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.k{font-size:15px;fill:#8b949e;letter-spacing:3px}
.h{font-size:22px;font-weight:700;fill:#f0f6fc}
.d{font-size:16px;fill:#8b949e}
.fade{opacity:0;animation:in .9s ease-out forwards}
@keyframes in{from{opacity:0}to{opacity:1}}
.pulse{animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<rect width="1200" height="250" rx="18" fill="#0d1117"/>
<text x="40" y="44" class="t k">EN LO QUE ANDO</text>
<g class="fade" style="animation-delay:0.3s">
<rect x="40" y="70" width="265" height="140" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="52" y="88" width="4" height="104" rx="2" fill="#39d353"/>
<circle cx="82" cy="106" r="8" fill="#39d353" class="pulse" style="animation-delay:0.3s"/>
<text x="102" y="113" class="t h">Parlando</text>
<text x="82" y="160" class="t d">Transcripción en vivo</text>
</g><g class="fade" style="animation-delay:0.55s">
<rect x="325" y="70" width="265" height="140" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="337" y="88" width="4" height="104" rx="2" fill="#58a6ff"/>
<circle cx="367" cy="106" r="8" fill="#58a6ff" class="pulse" style="animation-delay:0.55s"/>
<text x="387" y="113" class="t h">Zoila</text>
<text x="367" y="160" class="t d">App para el hogar</text>
</g><g class="fade" style="animation-delay:0.8s">
<rect x="610" y="70" width="265" height="140" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="622" y="88" width="4" height="104" rx="2" fill="#d2a8ff"/>
<circle cx="652" cy="106" r="8" fill="#d2a8ff" class="pulse" style="animation-delay:0.8s"/>
<text x="672" y="113" class="t h">Agentes de IA</text>
<text x="652" y="160" class="t d">Asistentes automáticos</text>
</g><g class="fade" style="animation-delay:1.05s">
<rect x="895" y="70" width="265" height="140" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="907" y="88" width="4" height="104" rx="2" fill="#ffa657"/>
<circle cx="937" cy="106" r="8" fill="#ffa657" class="pulse" style="animation-delay:1.05s"/>
<text x="957" y="113" class="t h">Música</text>
<text x="937" y="160" class="t d">Canciones y producción</text>
</g>
</svg>
