<rect x="610" y="210" width="550" height="124" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="622" y="228" width="4" height="88" rx="2" fill="#ffa657"/>
<circle cx="650" cy="246" r="7" fill="#ffa657" class="pulse" style="animation-delay:0.65s"/>
<text x="668" y="253" class="t h">TribuDicta</text>
<text x="642" y="286" class="t d">Dictado por voz para</text>
<text x="642" y="308" class="t d">Windows y Mac</text>
<text x="1140" y="253" text-anchor="end" class="t g" fill="#ffa657">APP</text>
