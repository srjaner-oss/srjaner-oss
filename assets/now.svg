<rect x="40" y="66" width="550" height="124" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="52" y="84" width="4" height="88" rx="2" fill="#39d353"/>
<circle cx="80" cy="102" r="7" fill="#39d353" class="pulse" style="animation-delay:0.2s"/>
<text x="98" y="109" class="t h">JANO</text>
<text x="72" y="142" class="t d">Consultoría en automatización</text>
<text x="72" y="164" class="t d">de procesos con IA</text>
<text x="570" y="109" text-anchor="end" class="t g" fill="#39d353">EMPRESA</text>
</g><g class="fade" style="animation-delay:0.35s">
<rect x="610" y="66" width="550" height="124" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="622" y="84" width="4" height="88" rx="2" fill="#58a6ff"/>
<circle cx="650" cy="102" r="7" fill="#58a6ff" class="pulse" style="animation-delay:0.35s"/>
<text x="668" y="109" class="t h">Parlando</text>
<text x="642" y="142" class="t d">Transcripción en vivo para</text>
<text x="642" y="164" class="t d">personas con dificultad auditiva</text>
<text x="1140" y="109" text-anchor="end" class="t g" fill="#58a6ff">APP</text>
</g><g class="fade" style="animation-delay:0.5s">
<rect x="40" y="210" width="550" height="124" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="52" y="228" width="4" height="88" rx="2" fill="#d2a8ff"/>
<circle cx="80" cy="246" r="7" fill="#d2a8ff" class="pulse" style="animation-delay:0.5s"/>
<text x="98" y="253" class="t h">Zoila</text>
<text x="72" y="286" class="t d">Asistente del hogar: mercado,</text>
<text x="72" y="308" class="t d">inventario, compras y cocina</text>
<text x="570" y="253" text-anchor="end" class="t g" fill="#d2a8ff">APP</text>
