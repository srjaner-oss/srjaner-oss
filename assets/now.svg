<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="364" viewBox="0 0 1200 364">
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.k{font-size:15px;fill:#8b949e;letter-spacing:3px}
.h{font-size:21px;font-weight:700;fill:#f0f6fc}
.d{font-size:15px;fill:#8b949e}
.g{font-size:12px;letter-spacing:2px;font-weight:600}
.fade{opacity:0;animation:in .9s ease-out forwards}
@keyframes in{from{opacity:0}to{opacity:1}}
.pulse{animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<rect width="1200" height="364" rx="18" fill="#0d1117"/>
<text x="40" y="44" class="t k">EN LO QUE ANDO</text>
